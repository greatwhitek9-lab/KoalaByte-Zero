# BOM for Koalabyte Zero Rev 0.5 Version B firmware + production starter package
# Keep aligned with koalabyte/config.py and device build schematics/.
# Normalized production target: DS1 800x480, CAM1 IMX708, REG1 5V 10-12A, F1 10A-class protection.

- ref: A1
  aliases: [U1]
  qty: 1
  category: Compute
  manufacturer: NVIDIA
  mpn: Jetson Orin Nano Super Developer Kit
  footprint: Dev kit module / carrier mounting envelope
  mount: Hand/install
  notes: Main AI/compute board; keep as off-the-shelf module for Rev0.5 and validate official NVIDIA mechanical/pinout docs before any custom carrier.

- ref: EYE1
  qty: 1
  category: Eye Display / MCU
  manufacturer: ESP32-S3 AIoT display module
  mpn: ESP32-S3 1.28inch Double Eye Round LCD AIoT Development Board, Onboard Dual 1.28inch IPS Displays
  footprint: Dual round LCD eye board panel mount + USB/UART clearance
  mount: Hand/install
  notes: KoalaByte dual-eye display/controller board above the 3.5 inch main screen and below enlarged ears; replaces separate legacy eye-ring concept.

- ref: DS1
  qty: 1
  category: Display
  manufacturer: Generic
  mpn: 3.5 inch HDMI LCD touchscreen, 800x480, 5V
  footprint: HDMI + USB touch module mounting envelope
  mount: Hand/install
  notes: Main KoalaByte Version B display in lower front face; normalized from production mismatch to 800x480.

- ref: CAM1
  qty: 1
  category: Camera
  manufacturer: Arducam / Raspberry Pi compatible
  mpn: IMX708 CSI camera module
  footprint: Camera board mount + FFC clearance
  mount: Hand/install
  notes: Nose-pod CSI camera between the two EYE1 round LCD displays; verify Jetson CSI cable orientation.

- ref: HUB1
  qty: 1
  category: USB
  manufacturer: Generic / StarTech / Adafruit equivalent
  mpn: Mini internal powered USB 3.0 hub
  footprint: USB hub module envelope
  mount: Hand/install
  notes: Internal expansion for SDR, Wi-Fi, debug, and USB touch. Powered hub preferred.

- ref: WIFI1
  aliases: [U_RF1]
  qty: 1
  category: Wi-Fi/BT
  manufacturer: MediaTek
  mpn: MT7921K M.2 Key-E or USB Wi-Fi adapter
  footprint: M.2 E-Key socket or USB adapter envelope
  mount: Hand/install
  notes: Wi-Fi/BLE interface for authorized testing; route to external WiFi/Bluetooth antenna and validate regulatory use.

- ref: SDR1
  qty: 1
  category: SDR
  manufacturer: RTL-SDR Blog / Generic
  mpn: RTL-SDR Blog V4 or RTL2832U + R820T2
  footprint: USB dongle/module envelope
  mount: Hand/install
  notes: Receive-only SDR module; route to external SMA.

- ref: GPS1
  qty: 1
  category: GPS
  manufacturer: u-blox / Generic
  mpn: NEO-M8N GPS module
  footprint: UART module/header
  mount: Hand/install
  notes: GPS/wardriving location module; place antenna away from Jetson, battery, and high-current wiring.

- ref: NFC1
  aliases: [U_RF2]
  qty: 1
  category: NFC
  manufacturer: Elechouse / Adafruit / Generic
  mpn: PN532 NFC module
  footprint: I2C module/header
  mount: Hand/install
  notes: NFC read/write/emulate support; coil remains internal inside left ear and is not an external whip antenna. Use level-safe 3.3V mode.

- ref: RF1
  aliases: [U_RF4]
  qty: 1
  category: Sub-GHz
  manufacturer: Ebyte / Generic
  mpn: CC1101 module
  footprint: SPI module/header
  mount: Hand/install
  notes: Sub-GHz radio experiments; route to LoRa/Sub-GHz external antenna and obey RF law.

- ref: LORA1
  qty: 1
  category: LoRa
  manufacturer: HopeRF / Generic
  mpn: SX1276/SX1278 LoRa module
  footprint: SPI module/header
  mount: Hand/install
  notes: LoRa mesh prototype; use correct regional frequency. Share selected external LoRa/Sub-GHz antenna path only with validated RF switch/harness if required.

- ref: IR1
  aliases: [IR_RX1]
  qty: 1
  category: IR Receiver
  manufacturer: Vishay / Generic
  mpn: VS1838B / TSOP38238 38kHz infrared receiver module
  footprint: Through-hole/module
  mount: Hand/install
  notes: IR reader/receiver on top-of-head/front brow behind an IR-transparent window.

- ref: IRTX1-3
  aliases: [IR_TX1]
  qty: 3
  category: IR TX
  manufacturer: Vishay / Generic
  mpn: 940nm high-output IR LED
  footprint: 5mm LED
  mount: Hand/install
  notes: IR transmitters on top-of-head/front brow adjacent to IR receiver; use Q1 transistor/MOSFET driver, not direct GPIO.

- ref: Q1
  aliases: [Q_IR1]
  qty: 1
  category: Driver
  manufacturer: ON Semiconductor / Generic
  mpn: 2N2222 / AO3400 / 2N7002 IR LED driver
  footprint: TO-92 / SOT-23
  mount: SMT/Hand
  notes: IR LED drive stage; add resistor sized to LED current.

- ref: SPK1
  qty: 1
  category: Audio
  manufacturer: Generic
  mpn: 8 Ohm mini speaker / piezo buzzer
  footprint: Speaker/buzzer module envelope
  mount: Hand/install
  notes: UI sounds and alerts; optional amplifier recommended for speaker.

- ref: SW1-SW8
  qty: 8
  category: Controls
  manufacturer: Generic / E-Switch equivalent
  mpn: Tactile buttons / D-pad / side buttons
  footprint: Panel mount / button harness
  mount: Hand/install
  notes: F1-F6/menu/select/back controls; debounce in ESP32 firmware. J10 carries button matrix/direct GPIO.

- ref: PWR1
  aliases: [BAT1]
  qty: 1
  category: Power
  manufacturer: Anker / Adafruit / Custom cell pack equivalent
  mpn: USB-C PD power bank or 2S Li-ion pack + BMS
  footprint: Module/battery bay + keyed high-current connector
  mount: Hand/install
  notes: Prototype power source; use certified cells/modules and include fuse.

- ref: BMS1
  qty: 1
  category: Power / Battery Protection
  manufacturer: Daly / Generic equivalent
  mpn: 2S Li-ion BMS with balancing and overcharge protection
  footprint: 2S BMS module envelope with high-current wiring clearance
  mount: Hand/install
  notes: Required when using the 2S2P 21700 Li-ion pack option; keep wiring short, fused, and serviceable.

- ref: J_CHG
  qty: 1
  category: Power / Charging
  manufacturer: Generic / CUI / Amphenol equivalent
  mpn: 2S Li-ion charger input, 8.4V CC/CV, 2A-4A target
  footprint: Panel connector or keyed charging harness
  mount: Hand/install
  notes: Charging input must be isolated from live system rail or power-path regulation.

- ref: REG1
  qty: 1
  category: Power
  manufacturer: Pololu / DFRobot / Murata equivalent
  mpn: 5V 10-12A synchronous buck regulator module
  footprint: Buck regulator module envelope with thermal clearance
  mount: Hand/install
  notes: Main 5V rail for Jetson + display + USB load. Minimum 10A, preferred 12A.

- ref: REG2
  qty: 1
  category: Power
  manufacturer: Pololu / DigiKey equivalent
  mpn: 3.3V 1A regulator
  footprint: Module / SOT-223
  mount: SMT/Hand
  notes: Sensors and logic rail; common ground required.

- ref: F1
  qty: 1
  category: Protection
  manufacturer: Littelfuse / Bel equivalent
  mpn: 10A resettable fuse or replaceable blade fuse
  footprint: PTC/inline/fuse footprint
  mount: SMT/Hand
  notes: Main input protection sized for the 10-12A power path after current testing.

- ref: J_USB
  aliases: [J11]
  qty: 1
  category: Power / USB-C Input
  manufacturer: USB-C connector / PD trigger module equivalent
  mpn: USB-C power input / 5V main input; validate PD/current design
  footprint: USB-C connector, PD trigger, or harnessed module envelope
  mount: SMT/Hand
  notes: Main USB-C or 5V input path. Validate PD negotiation/current limit before tying to the system rail.

- ref: J1-J14
  qty: 14
  category: Connectors
  manufacturer: JST / Molex / Amphenol / Generic
  mpn: JST-XH/PH, 2.54mm headers, SMA bulkheads
  footprint: Mixed serviceable wiring harness connectors
  mount: SMT/Hand
  notes: Use locking connectors for handheld reliability. See device build schematics/Docs/KoalaByte_Rev0_5_VersionB_Net_Summary.txt.

- ref: SW_PWR
  qty: 1
  category: Controls / Power
  manufacturer: E-Switch / C&K equivalent
  mpn: Rear panel latching power on/off switch, >=10A DC or logic-controlled load switch
  footprint: Rear enclosure panel mount or harnessed switch
  mount: Hand/install
  notes: Back-mounted KoalaByte power on/off switch; main disconnect or regulator-enable path; replaces nose switch concept.

- ref: ANT_WIFI_BT
  qty: 1
  category: Antenna
  manufacturer: Generic
  mpn: 2.4/5GHz WiFi/Bluetooth whip antenna, IPEX/SMA feed as selected
  footprint: External antenna / bulkhead mount
  mount: Hand/install
  notes: Default external antenna 1; top/rear-left or top/rear service position.

- ref: ANT_LORA_SUBGHZ
  qty: 1
  category: Antenna
  manufacturer: Generic
  mpn: LoRa/Sub-GHz whip antenna, 868/915MHz or regional band as selected, SMA connector
  footprint: External SMA antenna / bulkhead mount
  mount: Hand/install
  notes: Default external antenna 2; top/rear-center or top/rear-right service position; match antenna to selected band.

- ref: ANT_SDR
  qty: 1
  category: Antenna
  manufacturer: Generic
  mpn: SDR whip antenna / SMA-connected antenna matched to use case
  footprint: External SMA antenna / bulkhead mount
  mount: Hand/install
  notes: Default external antenna 3; right-side SMA or rear-right SMA position for RTL-SDR receive.

- ref: ANT_LTE_OPT
  qty: 0
  category: Antenna / Optional
  manufacturer: Generic
  mpn: Optional cellular / 4G LTE antenna
  footprint: External LTE antenna / bulkhead mount
  mount: DNP unless LTE module is installed
  notes: Optional 4th external antenna only for LTE build. Do not populate on default Koalabyte Zero build.

- ref: ANT_GPS_PATCH
  qty: 1
  category: Antenna
  manufacturer: Generic
  mpn: Active ceramic GPS patch antenna
  footprint: Patch antenna module/envelope
  mount: Hand/install
  notes: GPS is not counted as an external whip antenna; mount on top/rear deck with sky-facing clearance.

- ref: MECH1
  qty: 1
  category: Mechanical
  manufacturer: Local print service
  mpn: 3D printed clamshell enclosure
  footprint: PETG/ABS/nylon Version B housing
  mount: Mechanical
  notes: Add heat inserts and airflow.

- ref: FAST1
  qty: 1
  category: Mechanical
  manufacturer: Amazon / McMaster equivalent
  mpn: M2.5/M3 screws, brass inserts, standoffs
  footprint: Assorted assembly hardware
  mount: Mechanical
  notes: Use threadlocker where appropriate.
