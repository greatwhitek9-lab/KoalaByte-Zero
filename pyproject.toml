[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koalabyte-firmware"
version = "0.5.0"
description = "KoalaByte Rev 0.5 firmware runtime"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0.1",
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
koalabyte = "koalabyte.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
